<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0b0e12">
  <title>Northstar · Futures Terminal</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <a class="brand" href="#overview" aria-label="Northstar home">
        <span class="brand-mark"><i></i><i></i><i></i></span>
        <span><strong>northstar</strong><small>TRADING TERMINAL</small></span>
      </a>
      <div class="workspace-label">BOTS</div>
      <nav class="side-nav" id="nav" aria-label="Bots"></nav>
      <div class="sidebar-spacer"></div>
      <div class="sidebar-card">
        <div class="sidebar-card-top"><span class="pulse"></span> PAPER BUDGET</div>
        <strong class="big" id="pool-free">—</strong>
        <p id="pool-text">Teeno bots ka milakar (haath wali trades).</p>
      </div>
    </aside>
    <main class="main-content">
      <header class="topbar">
        <div class="breadcrumb"><span>Terminal</span><b>/</b><strong id="crumb">Overview</strong></div>
        <div class="top-actions">
          <div class="connection"><span class="pulse" id="conn-dot"></span><span id="conn-text">...</span></div>
          <span class="demo-pill"><span></span> PAPER MODE</span>
        </div>
      </header>
      <div id="view"></div>
    </main>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="/lightweight-charts.js"></script>
  <script src="/app.js"></script>
</body>
</html>
